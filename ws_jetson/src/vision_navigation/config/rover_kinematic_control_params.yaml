# Steering Control Parameters
# Vision Navigation System - Control Tuning Configuration
# Date: August 6, 2026

rover_kinematic_control:
  ros__parameters:
    # Control law (static-gain feedback + Ackermann feedforward, single-step
    # MPC form):
    #   steer = k_lat*b_ema + k_head*theta_ema + atan(wheelbase_m * curvature_m_ema)
    #
    # Sign: theta, b, and steer_angle all use "+ = correct by steering
    # right" in this codebase (see rover_kinematic_control_node.py), so both
    # feedback terms are ADDED, not subtracted. A "-k1*e_lat - k2*e_heading"
    # form only applies under the opposite steering-angle-positive
    # convention (e.g. ISO 8855, positive = left) -- do not copy that sign
    # pattern in here without re-deriving it against this codebase's
    # convention first.
    #
    # Replaces the previous PID (kp*e + ki*integral(e) + kd*de/dt) with a
    # pure proportional static-gain law -- no integral or derivative term.
    # k_lat/k_head are a fixed discrete-time LQR solution on the linearized
    # error model (b_dot = v*theta, theta_dot = -(v/L)*delta; v ~ 0.15-0.20
    # m/s cruise speed, L = wheelbase_m, dt ~ 1/20 s measured control-loop
    # period), solved offline and applied as a static gain each step:
    #   LQR solve: k1 = 3.162 rad/m, k2 = 2.024 rad/rad
    #   k_lat  = k1 * (180/pi) = 181.17  -- rad->deg (b is metres, steer is degrees)
    #   k_head = k2             = 2.024  -- unit-invariant (theta and steer are both angles)
    k_lat: 181.17                # Gain on lateral offset b (deg/metre)
    k_head: 2.024                # Gain on heading error theta (deg/deg)

    # Ackermann feedforward: atan(wheelbase_m * curvature_m_ema)
    # curvature (from the lane fit) is a BEV-pixel parabola coefficient A
    # (x = A*y^2 + B*y + C), 1/px, not 1/m. The BEV is metric (isotropic
    # bev_px_per_m), so real curvature 1/R = 2 * bev_px_per_m * A -- see
    # rover_kinematic_control_node.py for the derivation.
    wheelbase_m: 0.4875           # Front-to-rear axle distance, metres
    bev_px_per_m: 200.0           # BEV pixel scale (LaneDetectionConfig.BEV_PX_PER_M)

    # Filtering (unchanged -- still smooths theta/b/curvature before the
    # control law runs, independent of the PID-to-static-gain swap above)
    ema_alpha: 0.05              # Exponential moving average smoothing (0-1)

    # Speed (0-100% PWM duty). The RPi caps the final duty at spd_limit_cap
    # (40%), which is the hard safety ceiling; this is the target it aims for.
    # The gap between the two is the headroom the closed-loop speed controller
    # uses to push through terrain load.
    # 16 is the measured runnable cruise duty on this rover (15-16 drives fine,
    # 11 stalls on the ramp). The closed-loop controller raises duty above this
    # when terrain loads the drivetrain, bounded by spd_limit_cap.
    speed_ref: 16                # Target cruise speed when the lane is detected

    # Output saturation
    # 45.0 (not the full +-60 mechanical limit) as a conservative margin
    # while this static-gain law is unvalidated on the track. Widen toward
    # 60.0 only after field testing confirms it behaves.
    #
    # NOTE: at k_lat=181.17, even a modest lookahead offset saturates this
    # clamp on its own (b=0.15m -> 27 deg from the b-term alone, before
    # adding the theta-term or feedforward) -- expect the commanded angle to
    # sit at/near the clamp often, not just on sharp turns. If field testing
    # shows the rover chattering between clamped extremes rather than
    # settling, that is this gain being too aggressive for the ±45° budget,
    # not a sign or logic bug.
    steer_max_deg: 45.0           # Maximum steering angle (±degrees)
    steer_when_lost: 0.0          # Steering when lane not detected
