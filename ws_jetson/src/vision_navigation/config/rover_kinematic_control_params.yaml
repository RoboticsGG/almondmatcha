# Steering Control Parameters
# Vision Navigation System - Control Tuning Configuration
# Date: November 4, 2025

rover_kinematic_control:
  ros__parameters:
    # Error weights (combined error: e = k_e1*theta + k_e2*b)
    k_e1: 1.0                    # Weight on heading error (theta)
    # `b` (lateral offset) is metres, not the BEV pixels it used to be --
    # 20.0 = the old 0.1 rescaled by BEV_PX_PER_M (200) so e stays
    # numerically the same as before for the same physical offset. Rescale
    # again if BEV_PX_PER_M ever changes.
    k_e2: 20.0                   # Weight on lateral offset (b, metres)
    
    # PID gains (control law: u_pid = kp*e + ki*∫e*dt + kd*de/dt)
    k_p: 4.0                     # Proportional gain
    k_i: 0.01                     # Integral gain
    k_d: 0.01                     # Derivative gain

    # Feedforward gain (u_ff = k_ff * curvature_ema; u_total = u_pid + u_ff)
    #
    # Now derivable rather than guessed. The bird's-eye view is metric
    # (200 px/m, isotropic), so the fitted coefficient A is a real arc:
    # A = 1/(2*R*S), and Ackermann needs delta = atan(L/R) for radius R.
    # With wheelbase L = 0.4875 m (48.75 cm) and S = 200 px/m:
    #     k_ff = 2 * S * L * (180/pi) = 11172.7
    # Verified against exact Ackermann: R=10 m -> 2.79 deg (exact 2.79),
    # R=20 m -> 1.40 (exact 1.40), R=36.5 m -> 0.77 (exact 0.76).
    #
    # Held at 0.0 for the first run on the corrected geometry. On a 400 m
    # track (bend radius ~36.5 m) the correct feedforward is only ~0.77 deg,
    # which is at or below the noise floor of the curvature fit over a 1.7 m
    # lookahead -- so it buys almost nothing, while a momentarily bad fit
    # multiplied by 11172.7 would inject a large steering kick. Feedback alone
    # covers this track. Raise toward 11172.7 only after the logs show
    # curvature_ema is clean and stable through the bends.
    k_ff: 0.0                    # Feedforward gain on filtered curvature (derived value: 11172.7)

    # Filtering
    ema_alpha: 0.05              # Exponential moving average smoothing (0-1)
    
    # Speed (0-100% PWM duty). The RPi caps the final duty at spd_limit_cap
    # (40%), which is the hard safety ceiling; this is the target it aims for.
    # The gap between the two is the headroom the closed-loop speed controller
    # uses to push through terrain load.
    # 16 is the measured runnable cruise duty on this rover (15-16 drives fine,
    # 11 stalls on the ramp). The closed-loop controller raises duty above this
    # when terrain loads the drivetrain, bounded by spd_limit_cap.
    speed_ref: 16                # Target cruise speed when the lane is detected

    # Output saturation
    steer_max_deg: 60.0          # Maximum steering angle (±degrees)
    steer_when_lost: 0.0         # Steering when lane not detected
