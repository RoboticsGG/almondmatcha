# System Configuration - Headless Mode
# Vision Navigation System - Production/SSH Configuration
# Camera and Lane Detection parameters only (GUI disabled)
# Steering control parameters are in rover_kinematic_control_params.yaml
# Date: November 4, 2025

camera_stream:
  ros__parameters:
    width: 960
    height: 540
    fps: 30
    device_serial: "806312060441"  # (the D405 is 218622277831)
    fallback_video: "/home/yupi/Almond/ros2-jetson-ws/001.mp4"
    open_cam: false              # Headless: no camera preview
    enable_depth: false
    video_path: ""               # Set to video file path for offline mode
    loop_video: true
    json_config: ""

lane_detection:
  ros__parameters:
    show_window: false           # Headless: no lane visualization

    # ROI trapezoid corners [x0,y0, x1,y1, x2,y2, x3,y3], authored at
    # roi_base_width x roi_base_height (bottom-left, bottom-right, top-right,
    # top-left). Scaled to the actual camera_stream resolution at runtime.
    roi_base_points: [0.0, 500.0, 1280.0, 500.0, 900.0, 200.0, 400.0, 200.0]
    roi_base_width: 1280.0
    roi_base_height: 720.0

    # Margin added around the ROI bounding box before cropping (in
    # roi_base_width/height units, scaled to actual frame size)
    crop_margin_px: 20.0

    # Sliding-window lane search (tied to the cropped canvas size -- retune
    # if roi_base_points, crop_margin_px, or camera_stream resolution change)
    sliding_windows: 9
    window_margin: 100
    min_window_pixels: 50
    min_lane_pixels: 50
