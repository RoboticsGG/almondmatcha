# System Configuration - Headless Mode
# Vision Navigation System - Production/SSH Configuration
# Camera and Lane Detection parameters only (GUI disabled)
# Steering control parameters are in rover_kinematic_control_params.yaml
# Date: November 4, 2025

camera_stream_node:
  ros__parameters:
    width: 1280
    height: 720
    fps: 30
    # Pin the D415 by serial so a second camera on the bus (D405
    # 218622277831) can never be picked up instead. If the node exits with
    # "Failed to start RealSense pipeline", check this against the
    # "Connected devices:" list it prints.
    device_serial: "806312060441"
    fallback_video: "/home/yupi/Almond/ros2-jetson-ws/001.mp4"
    open_cam: false              # Headless: no camera preview
    enable_depth: false
    video_path: ""               # Set to video file path for offline mode
    loop_video: true
    json_config: ""

lane_detection_node:
  ros__parameters:
    show_window: false           # Headless: no lane visualization

    # ROI trapezoid corners [x0,y0, x1,y1, x2,y2, x3,y3], authored at
    # roi_base_width x roi_base_height (bottom-left, bottom-right, top-right,
    # top-left). Scaled to the actual camera_stream resolution at runtime.
    #
    # Derived from the physical camera mount, NOT hand-authored: D415 colour
    # stream 50 cm above the ground, tilted 15 deg down (+-3 deg mounting
    # tolerance; the numbers below use the nominal 15 deg), on the lateral
    # centreline, 8 cm behind the front axle. These are the image projection
    # of the ground rectangle X = -0.90..+0.90 m, Z = 1.30..3.00 m from the
    # camera (= 1.22..2.92 m ahead of the front axle). Regenerate with
    # `ros2 run vision_navigation regenerate_roi` if the mount changes --
    # see docs/VISION_PIPELINE.md "Regenerating the ROI".
    roi_base_points: [39.0, 458.0, 1241.0, 458.0, 915.0, 270.0, 365.0, 270.0]
    roi_base_width: 1280.0
    roi_base_height: 720.0

    # Margin added around the ROI bounding box before cropping (in
    # roi_base_width/height units, scaled to actual frame size) -- trims the
    # unwanted surroundings before the per-pixel preprocessing runs.
    crop_margin_px: 20.0

    # Bird's-eye output canvas, fixed (not the crop size) so both axes carry
    # the same metres-per-pixel. 200 px/m: the ROI spans 1.80 m laterally and
    # maps to the middle 50% of the canvas, and 1.70 m longitudinally.
    # This is what makes theta a real heading angle in degrees, b a real
    # cross-track offset in metres (this scale is what lane_detector.py
    # divides by to convert b from BEV pixels to metres) and curvature a
    # real 1/m arc.
    bev_width_px: 720
    bev_height_px: 340

    # Sliding-window lane search.
    # Measured track: 2.50 m red-edge-to-red-edge, three 5 cm lines (two
    # edges + centre), centre line offset +-0.50 m from the track's own
    # midpoint (side depends on rover heading, not fixed) -> adjacent-line
    # gaps are ASYMMETRIC, 0.75 m and 1.75 m. The binding constraint is
    # always the smaller one: 0.75 m -> 150 px at 200 px/m ->
    # window_margin MUST stay below half that (75) or a window straddles two
    # lines and recenters into the gap between them. (Supersedes an earlier
    # 0.61 m/122 px/61 px figure that assumed a symmetric 1.22 m lane -- that
    # was never a real measurement of this track.)
    # search_band_px bounds where the search may start, relative to where the
    # lane was last frame -- without it an unrestricted argmax picks whichever
    # of the three parallel lines carries the most pixels, and flips between
    # them as lighting/wear/drift change the balance.
    sliding_windows: 9
    window_margin: 40
    min_window_pixels: 50
    min_lane_pixels: 50
    search_band_px: 45.0

    # Absolute bound on the fitted offset, in METRES (b itself is metres,
    # not the BEV pixels it used to be). search_band_px limits per-frame
    # movement but permits a steady walk; a field log shows b creeping from
    # -46 to -230 px (under the old px-based reporting) over 19 frames and
    # settling 1.15 m off the rover's centreline, still reporting "Detected".
    # 0.50 m is also the downstream clamp in rover_kinematic_control, beyond
    # which the value cannot reach the controller unsaturated anyway.
    max_abs_b_m: 0.50

    # Oldest a frame (by camera_stream_node's capture-time header.stamp) may
    # be before this node drops it rather than steering on outdated geometry.
    # The subscription QoS (depth=1) already stops a backlog from building
    # up; this catches a frame that was already stale by the time a single
    # slow detection pass or scheduling jitter let it through.
    max_frame_age_sec: 0.1
