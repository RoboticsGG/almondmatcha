# Closed-Loop Speed Control Parameters
# chassis_control / chassis_controller_node — Domain 5 (ws_rpi)
# Date: July 27, 2026
#
# The speed loop is driven by /tpc_chassis_sensors (wheel encoders on the
# sensors STM32, ~4 Hz). Structure is feedforward + PID trim:
#
#     duty = target_pct + kp*e + ki*∫e dt + kd*de/dt      e in % of full scale
#
# target_pct (the commanded speed) is the feedforward term, so at zero error the
# output equals what open-loop would have sent and the PID only corrects for
# terrain/load. The error is expressed in percent-of-full-scale rather than raw
# encoder ticks/sec, which means these gains stay valid when max_ticks_per_sec
# is re-calibrated — with a ticks/sec error they would silently need rescaling.

chassis_controller_node:
  ros__parameters:
    # Kill-switch: false forces open-loop passthrough with no rebuild
    # (e.g. `ros2 param set /chassis_controller_node use_closed_loop_speed true`).
    #
    # DEFAULT OFF until max_ticks_per_sec below is calibrated. With the
    # placeholder value the loop limit-cycles: if the real tick rate is higher
    # than max_ticks_per_sec, measured speed reads as >100% of full scale, duty
    # is slammed to 0, the wheels stop, measured drops to 0, duty is slammed to
    # 100, and the cycle repeats at the encoder rate -- felt as a ~2 Hz
    # stop-and-spin judder. Open-loop is smooth; turn this on once calibrated.
    use_closed_loop_speed: false

    # --- PID gains (error and output both in % duty) ---------------------------
    # Starting values chosen by simulating the loop at the ~4 Hz encoder rate
    # across no-load / light / moderate load and a range of drivetrain lags.
    # Conservative on purpose: every reachable setpoint converges with <10%
    # overshoot, and unreachable ones saturate cleanly instead of winding up.
    #
    # Tuning order in the field:
    #   1. kp only (ki=0, kd=0). Raise until the speed responds briskly; back off
    #      if it hunts around the setpoint. Expect steady-state error at this stage
    #      under load — that is the integral's job, not kp's.
    #   2. Add ki to remove that residual error. Raise until it closes in a few
    #      seconds; too high shows up as slow oscillation.
    #   3. Leave kd at 0 unless there is real oscillation to damp — the encoder
    #      feed is only ~4 Hz and differentiating it amplifies quantisation noise.
    speed_kp: 0.3
    speed_ki: 0.5
    speed_kd: 0.0

    # Anti-windup clamp on the integral accumulator, in %·s.
    # The integral's duty authority is ki * this limit — here 0.5 * 100 = ±50%
    # duty of trim on top of the feedforward term. Keep that product in the
    # 40–60 range: too small and the loop cannot correct for load (the original
    # bug: ki*limit was 2% duty, so it never reached setpoint), too large and a
    # stalled wheel winds up a large lurch when it frees.
    speed_integral_limit: 100.0

    # Encoder ticks/sec at 100% duty. This constant DEFINES what "100% speed"
    # means to the loop, so calibrate it on the surface the rover actually drives.
    #
    # Calibrate: drive open-loop (use_closed_loop_speed: false) at 100% duty on
    # flat ground, log a run, then compute ticks/sec from consecutive
    # Encoder_Left/Encoder_Right rows in chassis_sensors.csv and average the two.
    #
    # A no-load bench run (wheels off the ground) reads HIGHER than on-ground and
    # is not a substitute — using it here makes the whole speed scale no-load
    # referenced, so on ground the loop pushes extra duty to chase a target it
    # can't reach. Use the bench run to verify encoder wiring/symmetry/linearity,
    # then set this from a ground run.
    #
    # PLACEHOLDER — replace before relying on closed-loop speed in the field.
    max_ticks_per_sec: 1000.0

    # --- Auto-calibration of max_ticks_per_sec --------------------------------
    # In open loop the commanded duty is known and the tick rate is measured, so
    # full-scale capability is directly observable: ticks_per_sec / (duty/100).
    # That ratio only means "capability" on level ground — on a ramp it drops
    # because of load. Runs start on near-flat ground, so sampling is confined to
    # a window that opens when the rover first drives, then the estimate is frozen
    # for the rest of the run so later terrain can never drag it down.
    auto_calibrate_max_ticks: true

    # Ignore duty below this: near the deadband the wheels barely turn and the
    # ratio is meaningless.
    #
    # MUST sit below the duty the rover actually cruises at, or no sample is ever
    # taken and calibration silently never happens. Target speed is 20%, and the
    # lane-lost caution speed is half that, so 15 samples the 20% cruise only.
    autocal_min_duty_pct: 15.0

    # Steady samples needed before the estimate is trusted (~10 s at 4 Hz).
    # Fewer than this when the window closes and it gives up, keeping the value
    # set above and saying so in the log.
    autocal_min_samples: 40

    # How long the learning window stays open, from first movement. Keep this
    # shorter than the flat opening stretch of your course: if a ramp falls
    # inside the window the estimate is dragged low, and too low is the direction
    # that makes the loop judder.
    autocal_window_sec: 60.0

    # Switch to closed-loop automatically once calibration succeeds, mid-run.
    # Safe to do here because the transition is bumpless (the loop's feedforward
    # term is the commanded duty, so at zero error its output equals what
    # open-loop was already sending) and because spd_limit_cap bounds the result
    # at 40% duty no matter what the controller asks for.
    auto_enable_closed_loop: true

    # --- Stall detection ------------------------------------------------------
    # Distinct from the load case the speed loop exists to handle: on a ramp the
    # wheels still turn, just slower, and the answer is more duty. If they are not
    # turning at all, more duty only heats a locked motor — so stop instead.
    # Latches, so it cannot chatter between stop and retry; clears when speed is
    # commanded back to zero.
    #
    # Note this only claims the near-zero-motion case. Encoders cannot distinguish
    # a stall from wheel slip (slip reads as fast rotation), so slip is out of
    # scope here — that needs the RTK ground speed on tpc_gnss_ublox.
    stall_detect_enabled: true
    stall_min_duty_pct: 15.0        # below the 20% cruise duty, above the 10% caution speed
    stall_min_ticks_per_sec: 10.0   # below this counts as "not turning"
    stall_timeout_sec: 2.0          # sustained this long before stopping

    # Encoder feed considered stale after this long with no message —
    # triggers fallback to open-loop passthrough. tpc_chassis_sensors
    # publishes at ~4 Hz (250 ms period), so 1.0 s tolerates a few missed
    # messages before falling back.
    sensor_timeout_sec: 1.0
